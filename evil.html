<html>
<head>
  <title>EVIL Skookie Zone</title>

  <style>
    body {
      background-image: url('img/eartbound.png');
      background-repeat: repeat;
      background-color: black;
      color: white;
      font-family: monospace;

      cursor: url('https://cdn.cursors-4u.net/previews/fleshy-heart-e2b49da1-64.webp') 36 19, pointer;

    .evil-soundboard h2 {

    .sound-buttons button {
      background: #4B1458;

      cursor: pointer;
    }

    .sound-buttons button:hover {
      background: #8B0000;
      transform: scale(1.05);
    }

    #sound-status {
      color: #DCA6FF;
      background: transparent;
      border: none;
      padding: 5px;
      margin: 12px 0 0;
    }

    #start-silenthill {
      display: none;
      background: #210D25;

      font-family: monospace;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Welcome to the EVIL Page!! meow</h1>

    <p>only nefarious things go on here...</p>
    <p>Practice being your EVILEST self</p>

    <div class="evil-layout">
      <div class="sfDevil-card">
        <img
          src="img/sf-devil.png"
          alt="SF Devil"
          id="sfDevil-image"
        >
      </div>

      <div class="evil-column">
        <p>The Devil from The Bible</p>
      </div>
    </div>

    <!-- soundboard -->
    <div class="evil-soundboard">
      <h2>Spooky Scary Soundboard</h2>

      <div class="sound-buttons">
        <button onclick="playEvilSound('spooky-sound')">
          AHH!
        </button>

        <button onclick="playEvilSound('freddy-scream')">
          Don't Get Jumpscared
        </button>

        <button onclick="playEvilSound('groovy')">
          when you build your own weapon to fight your dead girlfriend
        </button>

        <button onclick="stopEvilSound()">
          stop
        </button>
      </div>

      <p id="sound-status">
        WHAT SHALL WE DO, YOUR EVILNESS?
      </p>
    </div>
  </div>

  <!-- silent hill music -->
  <audio id="silenthill" loop preload="auto">
    <source src="sounds/Mirrored Guilt.wav" type="audio/wav">
  </audio>
  <button
    id="start-silenthill"
    onclick="startSilentHillMusic()">
    You feel very confused, there is a thick fog all along the webpage...
  </button>

  <p><a href="index.html">Back to the homepage</a></p>

  <script>
    const evilSounds = {
      "spooky-sound": "sounds/Spooky-sound.wav",
      "freddy-scream": "sounds/freddy scream.wav",
      "groovy": "sounds/groovy.wav"
    };

    const silenthill = document.getElementById("silenthill");
    const startButton = document.getElementById("start-silenthill");
    const soundStatus = document.getElementById("sound-status");

    let currentEvilSound = null;
    let musicFadeFrame = null;
    let soundRequest = 0;

    const musicVolume = 0.4;

    function updateFogButton() {
      startButton.style.display =
        !silenthill.paused && !silenthill.ended
          ? "block"
          : "none";
    }

    silenthill.addEventListener("play", updateFogButton);
    silenthill.addEventListener("pause", updateFogButton);
    silenthill.addEventListener("ended", updateFogButton);

    // fade background music
    function fadeMusicTo(targetVolume, duration = 700) {
      return new Promise((resolve) => {
        if (musicFadeFrame !== null) {
          cancelAnimationFrame(musicFadeFrame);
          musicFadeFrame = null;
        }

        const startVolume = silenthill.volume;
        const startTime = performance.now();

        function fadeStep(now) {
          const progress = Math.min(
            (now - startTime) / duration,
            1
          );

          const volume =
            startVolume +
            (targetVolume - startVolume) * progress;

          silenthill.volume = Math.max(
            0,
            Math.min(1, volume)
          );

          if (progress < 1) {
            musicFadeFrame = requestAnimationFrame(fadeStep);
          } else {
            silenthill.volume = Math.max(
              0,
              Math.min(1, targetVolume)
            );

            musicFadeFrame = null;
            resolve();
          }
        }

        musicFadeFrame = requestAnimationFrame(fadeStep);
      });
    }

    // Start music
    async function startSilentHillMusic() {
      silenthill.volume = musicVolume;

      try {
        await silenthill.play();

        updateFogButton();

        soundStatus.textContent =
          "You feel very confused, there is a thick fog all along the webpage...";
      } catch (error) {
        updateFogButton();

        soundStatus.textContent =
          "The fog is silent... try clicking a soundboard button.";
      }
    }

    // Fade music 
    async function playEvilSound(soundName) {
      const soundPath = evilSounds[soundName];
      if (!soundPath) return;

      const thisRequest = ++soundRequest;

      // Stop the sound
      if (currentEvilSound) {
        currentEvilSound.pause();
        currentEvilSound.currentTime = 0;
        currentEvilSound = null;
      }

      const effect = new Audio(soundPath);
      currentEvilSound = effect;

      soundStatus.textContent =
        "NOW PLAYING: " +
        soundName.toUpperCase().replace("-", " ") + "!!!";

      // Try to start background music
      if (silenthill.paused) {
        try {
          await silenthill.play();
          updateFogButton();
        } catch (error) {
          updateFogButton();
        }
      }

      // Fade the music 
      await fadeMusicTo(0);

      if (
        thisRequest !== soundRequest ||
        currentEvilSound !== effect
      ) {
        return;
      }

      try {
        await effect.play();
      } catch (error) {
        soundStatus.textContent =
          "Sound failed to play! Check the filename and path.";

        if (currentEvilSound === effect) {
          currentEvilSound = null;

          if (!silenthill.paused) {
            await fadeMusicTo(musicVolume);
          }
        }

        return;
      }

      effect.addEventListener("ended", async () => {
        if (currentEvilSound !== effect) return;

        currentEvilSound = null;

        soundStatus.textContent =
          "WHAT SHALL WE DO, YOUR EVILNESS?";

        if (!silenthill.paused) {
          await fadeMusicTo(musicVolume);
        }
      }, { once: true });
    }

    async function stopEvilSound() {
      ++soundRequest;

      if (currentEvilSound) {
        currentEvilSound.pause();
        currentEvilSound.currentTime = 0;
        currentEvilSound = null;
      }

      soundStatus.textContent =
        "Sound stopped. The fog returns...";

      if (silenthill.paused) {
        try {
          await silenthill.play();
          updateFogButton();
        } catch (error) {
          updateFogButton();
          return;
        }
      }

      await fadeMusicTo(musicVolume);
    }

    window.addEventListener("load", () => {
      startSilentHillMusic();
    });
  </script>
</body>
</html>

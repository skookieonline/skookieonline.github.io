<!DOCTYPE html>
<html>

<head>
  <title>Skookie Zone - My Art!</title>

  <style>
    body {
      background-image: url('img/hearts.gif');
      background-repeat: repeat;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #864D60;
     cursor: url('img/seal.cur') 0 0, auto;
  }

      /* Keep the seal cursor on links and interactive elements */
      a,
      a:hover,
      a:active,
      a:visited,
      button,
      button:hover,
      input,
      textarea,
      select,
      img[onclick] {
        cursor: url('img/seal.cur') 0 0, pointer !important;
      }
    /* Top banner */
    .banner {
      background-color: #FFE8F0;
      color: #864D60;
      text-align: center;
      padding: 10px 0;
      margin: 0;
      font-size: 36px;
      border-bottom: 2px solid #F2B8CB;
    }

    /* ASCII cat borders */
    .banner::before,
    .banner::after {
      content: "=^-3-^=  =^-3-^=  =^-3-^=  =^-3-^=  =^-3-^=";
      display: block;
      color: #D985A5;
      font-size: 16px;
      letter-spacing: 2px;
      white-space: nowrap;
      overflow: hidden;
      line-height: 20px;
    }

    .banner::before {
      margin-bottom: 8px;
    }

    .banner::after {
      margin-top: 8px;
    }

    /* Pink content boxes */
    p, h2 {
      background-color: #FFE8F0;
      color: #864D60;
      width: fit-content;
      max-width: calc(100% - 50px);
      box-sizing: border-box;
      padding: 10px;
      margin: 15px;
      border: 2px solid #F2B8CB;
    }

    /* Image gallery layout */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin: 15px;
      align-items: flex-start;
    }

    /* Same-sized pink frames */
    .gallery figure {
      background-color: #FFE8F0;
      border: 2px solid #F2B8CB;
      padding: 10px;
      margin: 0;
      width: 270px;
      max-width: 100%;
      color: #864D60;
      text-align: center;
      box-sizing: border-box;
    }

    /* All artwork uses the same dimensions */
    .gallery img {
      width: 246px;
      max-width: 100%;
      height: 246px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* Captions */
    .gallery figcaption {
      background-color: #FFE8F0;
      color: #864D60;
      margin-top: 8px;
      padding: 5px;
      overflow-wrap: anywhere;
    }

    /* Navigation */
    .navigation {
      background-color: #FFE8F0;
      border: 2px solid #F2B8CB;
      padding: 10px;
      margin: 15px;
      width: fit-content;
    }

    .navigation a {
      color: #864D60;
    }
  </style>
</head>

<body>

  <h1 class="banner">Skookie Zone Art Museum</h1>

  <p>Welcome to my Art Museum!! All art drawn by yours truly :3c</p>

  <!-- Back to homepage -->
  <div class="navigation">
    <a href="index.html">← Back to Skookie Zone</a>
  </div>

    <figure>

    <figure>

    <figure>

    <figure>

  <p>Thanks for looking at my art!! (-3-)</p>

</body>
</html>

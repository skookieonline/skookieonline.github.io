<!DOCTYPE html>
<html>
<head>
  <title>Safe Room</title>

  <style>
    body {
      background-color: #101B16;
      color: #C5D8B5;
      font-family: monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: default;
    }

    p {
      font-size: 28px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>

  <p>you are safe</p>

  <audio id="safe-haven" autoplay loop>
    <source src="sounds/Safe-Haven.wav" type="audio/wav">
  </audio>

  <script>
    const music = document.getElementById("safe-haven");

    music.volume = 0.4;

    // Try to start the music when the page opens
    music.play().catch(() => {
    });
  </script>
</body>
</html>

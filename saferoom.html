<!DOCTYPE html>
<html>
<head>
  <title>Safe Room</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #101B16;
      color: #C5D8B5;
      font-family: monospace;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      cursor: default;
    }

    /* Centered safe message */
    .safe-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      letter-spacing: 3px;
      margin: 0;
    }

    /* Homepage link at the bottom */
    .home-link {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 14px;
    }

    .home-link a {
      color: #C5D8B5;
    }

    .home-link a:hover {
      color: white;
    }

    /* Full-screen video intro */
    #intro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #intro video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #intro.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Full-screen door video -->
  <div id="intro">
    <video id="door-video" autoplay muted playsinline preload="auto">
      <source src="sounds/door.mp4" type="video/mp4">
      Your browser does not support this video.
    </video>
  </div>

  <!-- Safe room message -->
  <p class="safe-message">you are safe</p>

  <!-- Safe room music -->
  <audio id="safe-haven" autoplay loop>
    <source src="sounds/Safe-Haven.wav" type="audio/wav">
  </audio>

  <!-- Back to homepage link -->
  <p class="home-link">
    <a href="index.html">Back to the homepage</a>
  </p>

  <script>
    // Safe room music
    const music = document.getElementById("safe-haven");

    music.volume = 0.4;

    music.play().catch(() => {
      // Browser may block audio autoplay.
    });

    // Door video intro
    const intro = document.getElementById("intro");
    const introVideo = document.getElementById("door-video");

    let introEnded = false;

    function endIntro() {
      if (introEnded) return;

      introEnded = true;
      intro.classList.add("fade-out");

      setTimeout(() => {
        intro.remove();
      }, 1500);
    }

    // Fade out when the video finishes
    introVideo.addEventListener("ended", endIntro);

    // Skip intro if the video cannot load
    introVideo.addEventListener("error", endIntro);

    // Start video playback
    introVideo.play().catch((error) => {
      console.log("Video playback failed:", error);
      endIntro();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Safe Room</title>

  <style>
    body {
      background-color: #101B16;
      color: #C5D8B5;
      font-family: monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: default;
    }

    .safe-message {
      font-size: 28px;
      letter-spacing: 3px;
    }

    .home-link {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
    }

    .home-link a {
      color: #C5D8B5;
    }

    .home-link a:hover {
      color: white;
    }

    /* Full-screen video */
    #intro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      transition: opacity 1.5s ease;
    }

    #intro video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #intro.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Door video -->
  <div id="intro">
    <video autoplay muted playsinline>
      <source src="sounds/door.mp4" type="video/mp4">
      Your browser does not support this video.
    </video>
  </div>

  <!-- Message -->
  <p class="safe-message">you are safe</p>

  <!-- Music -->
  <audio id="safe-haven" autoplay loop>
    <source src="sounds/Safe-Haven.wav" type="audio/wav">
  </audio>

  <!-- Back to homepage link -->
  <p class="home-link">
    <a href="index.html">Back to the homepage</a>
  </p>

  <script>
    // Safe room music
    const music = document.getElementById("safe-haven");

    music.volume = 0.4;

    music.play().catch(() => {
      // Browser may block autoplay.
    });

    // Video intro
    const intro = document.getElementById("intro");
    const introVideo = intro.querySelector("video");

    function endIntro() {
      intro.classList.add("fade-out");

      setTimeout(() => {
        intro.remove();
      }, 1500);
    }

    // Fade out when the video finishes
    introVideo.addEventListener("ended", endIntro);

    // If the video cannot play, don't leave the screen covered
    introVideo.addEventListener("error", endIntro);

    introVideo.play().catch(() => {
      endIntro();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Safe Room</title>

  <style>
    body {
      background-color: #101B16;
      color: #C5D8B5;
      font-family: monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: default;
    }

    .safe-message {
      font-size: 28px;
      letter-spacing: 3px;
    }

    .home-link {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
    }

    .home-link a {
      color: #C5D8B5;
    }

    .home-link a:hover {
      color: white;
    }
  </style>
</head>

<body>

  <p class="safe-message">you are safe</p>

  <audio id="safe-haven" autoplay loop>
    <source src="sounds/Safe-Haven.wav" type="audio/wav">
  </audio>

  <script>
    const music = document.getElementById("safe-haven");

    music.volume = 0.4;

    music.play().catch(() => {
    });
  </script>

  <p class="home-link">
    <a href="index.html">Back to the homepage</a>
  </p>
</body>
</html>
